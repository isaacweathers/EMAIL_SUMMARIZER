<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Summaries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .email-card {
            margin-bottom: 1rem;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
        }
        .email-header {
            padding: 1rem;
            background-color: #f8f9fa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .email-content {
            padding: 1rem;
            display: none;
        }
        .email-content.show {
            display: block;
        }
        .badge {
            margin-right: 0.5rem;
        }
        .nav-link {
            color: #0d6efd;
            text-decoration: none;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="my-4">
            <a href="/" class="nav-link">← Back to Dashboard</a>
        </nav>
        
        <h1 class="text-center mb-4">Email Summaries</h1>
        
        <div class="email-list">
            {% for email in emails %}
            <div class="email-card">
                <div class="email-header" onclick="toggleContent('email-{{ loop.index }}')">
                    <div>
                        <h5 class="mb-1">{{ email.subject }}</h5>
                        <div>
                            <span class="badge bg-primary">{{ email.category }}</span>
                            <span class="badge bg-{{ 'success' if email.sentiment == 'Positive' else 'danger' if email.sentiment == 'Negative' else 'warning' }}">
                                {{ email.sentiment }}
                            </span>
                            <span class="badge bg-info">{{ email.priority }}</span>
                            <small class="text-muted">{{ email.date.strftime('%Y-%m-%d') }}</small>
                        </div>
                    </div>
                    <span class="toggle-icon">▼</span>
                </div>
                <div id="email-{{ loop.index }}" class="email-content">
                    <h6>Summary:</h6>
                    <p>{{ email.summary }}</p>
                    <h6>Full Content:</h6>
                    <p>{{ email.body }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function toggleContent(id) {
            const content = document.getElementById(id);
            const header = content.previousElementSibling;
            const icon = header.querySelector('.toggle-icon');
            
            content.classList.toggle('show');
            icon.textContent = content.classList.contains('show') ? '▲' : '▼';
        }
    </script>
</body>
</html>
